<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <fieldset>
        <form action="#" name="daa" target="_self" method="post">
            <label for="name">username</label>
            <input type="text" name="name" id="name"
            placeholder="enter your name ">

            <label for="password">pasword</label>
            <input type="password" name="pass" id="pass"
            placeholder="enter your pasword"><br>
            
            <br></br>
            <label for="email">email</label>
            <input type="email" name="email" id="email"
            placeholder="enter your email"><br>

            <br><br>
            <label for="gender">gender</label>
            <input type="radio" name="gender" id="gender"><label for="gender">male</label>
            <input type="radio" name="gender" id="gender"><label for="gender">female</label>

            <br><br>
            <label for="hobb">hobbies</label>
            <input type="checkbox" name="hobbi1" id="hobbi1"><label for="hobbi1">reading</label>
            <input type="checkbox" name="hobbi2" id="hobbi2"><label for="hobbi2">writing</label>

            <br><br>
            <label for="dob">DOB</label>
            <input type="date" name="dob" id="dob">

            <br><br>
            <select name="lang" id="lang">
                <option value="">select language</option>
                <option value="c">C</option>
                <option value="c++">c++</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>


            </select>
            <br><br>
            
            <label for="tel">phone number</label>
            <input type="tel" name="tel" id="tel"
            

            <br><br>
            <label for="add">address</label>
            <textarea name="add" id="add" cols="10" rows="3"></textarea>

            <br><br>
            <input type="submit" value=""
            





        </form>

    </fieldset>

</body>
</html>
