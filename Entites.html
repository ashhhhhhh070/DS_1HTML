<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> entites  </title>
</head>
<body>
<p><b>bold text</b></p>
<p><strong> important text </strong></p>
<p><i>italic text </i></p>
<p><em> emphasized text</em></p>
<p><u>underlined text</u></p>
<p><mark>Highlighted text</mark></p>
<p><small> small text </small></p>
<p>h<sub>2</sub>o</p>
<p>X<sup>2</sup></p>
<p><del> deleted text </del></p>
<p><ins> inserted text </ins></p>
<p><code> inline code </code></p>
<p><kbd>key board input </kbd></p>
<p><pre>preformated text </pre></p>
<p><q> this is a long quotation </q></p>
<p><blockquote> this is a blockquotation</blockquote></p>
</body>
</html>
